<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Type With Parameter</title>
</head>
<body>
    <script>
        function show(){
            return "javascript"
        }
         let d=show();
         console.log(d);
    </script>
</body>
</html>
